apiVersion: codeco.he-codeco.eu/v1alpha1
kind: CodecoApp
metadata:
  name: bookinfo-{{.caseNo}}-{{ .schedulerName }}
  namespace: {{ .namespace }}
spec:
  appEnergyLimit: "50"
  performanceProfile: Greenness
  appName: bookinfo-swmapp-{{.caseNo}}-{{ .schedulerName }}

  codecoapp-msspec:
    - podspec:
        schedulerName: {{ .schedulerName }}
        containers:
          - name: productpage
            image: docker.io/istio/examples-bookinfo-productpage-v1:1.20.3
            imagePullPolicy: IfNotPresent
            ports:
              - containerPort: 9080
                protocol: TCP
      serviceName: productpage
      serviceChannels:
        - advancedChannelSettings:
            maxDelay: "10s"
          channelName: reviews
          serviceClass: BESTEFFORT
          otherService:
            appName: bookinfo-swmapp-{{.caseNo}}-{{ .schedulerName }}
            serviceName: reviews-v1
            port: 9080
        - advancedChannelSettings:
            maxDelay: "10s"
          channelName: details
          serviceClass: BESTEFFORT
          otherService:
            appName: bookinfo-swmapp-{{.caseNo}}-{{ .schedulerName }}
            serviceName: details
            port: 9080

    - podspec:
        schedulerName: {{ .schedulerName }}
        containers:
          - name: details
            image: docker.io/kaikanghuang/details:latest
            imagePullPolicy: IfNotPresent
            ports:
              - containerPort: 9080
      serviceName: details

    - podspec:
        schedulerName: {{ .schedulerName }}
        containers:
          - name: ratings
            image: docker.io/istio/examples-bookinfo-ratings-v1:1.20.3
            imagePullPolicy: IfNotPresent
            ports:
              - containerPort: 9080
                protocol: TCP
      serviceName: ratings

    - podspec:
        schedulerName: {{ .schedulerName }}
        containers:
          - name: reviews-v1
            image: docker.io/kaikanghuang/reviews:latest
            imagePullPolicy: IfNotPresent
            ports:
              - containerPort: 9080
                protocol: TCP
      serviceName: reviews-v1
      serviceChannels:
        - advancedChannelSettings:
            maxDelay: "10s"
          channelName: reviewstorate
          serviceClass: BESTEFFORT
          otherService:
            appName: bookinfo-swmapp-{{.caseNo}}-{{ .schedulerName }}
            serviceName: ratings
            port: 9080
                  
  complianceClass: High
  qosClass: BestEffort
  securityClass: Good

